<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Nikoloz Rogava</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<!-- Absolute paths: this page is shown for any missing address, at any depth -->
<link rel="stylesheet" href="/styles.css">
<style>
  @font-face { font-family: "BPG Typewriter A"; src: url("/fonts/bpg-typewriter-a.ttf") format("truetype"); unicode-range: U+10A0-10FF; }
  .nf { min-height: 100svh; max-width: 760px; margin: 0 auto; padding: 14vh var(--gut) 48px; display: flex; flex-direction: column; }
  .nf .nf__code { margin-top: 10px; font: 300 clamp(72px, 16vw, 160px)/.9 var(--serif); letter-spacing: -.04em; color: var(--ge); }
  .nf h1 { margin-top: 18px; font: 300 clamp(32px, 5vw, 52px)/1.05 var(--serif); letter-spacing: -.02em; }
  .nf p:not(.label):not(.nf__code):not(.nf__cta) { margin-top: 18px; font: 400 19px/1.6 var(--serif); color: var(--ink-2); max-width: 46ch; }
  .nf .ka { font-family: "BPG Typewriter A", var(--serif); -webkit-text-stroke: .4px currentColor; }
  .nf .pole { margin: 44px 0 40px; }
  .nf__cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
</style>
<script>
  try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<main class="nf">
  <p class="label">Between Brussels and Moscow</p>
  <p class="nf__code" aria-hidden="true">404</p>
  <h1>This page doesn’t exist.</h1>
  <p>The address may be mistyped, or the page has moved.</p>
  <p class="ka" lang="ka">ასეთი გვერდი არ არსებობს. შესაძლოა მისამართი არასწორადაა აკრეფილი.</p>
  <div class="pole pole--fig is-noformal" style="--p:.5" aria-hidden="true">
    <span class="pole__end pole__end--w">Brussels</span>
    <span class="pole__track"><span class="pole__mark"><i></i></span></span>
    <span class="pole__end pole__end--e">Moscow</span>
  </div>
  <p class="nf__cta">
    <a class="btn btn--solid" href="/">Go to the site</a>
    <a class="btn ka" href="/ka/" lang="ka">ქართული ვერსია</a>
  </p>
</main>
</body>
</html>
